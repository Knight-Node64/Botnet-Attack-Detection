apiVersion: apps/v1
kind: Deployment
metadata:
  name: botnet-detector-deployment
  labels:
    app: botnet-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: botnet-detector
  template:
    metadata:
      labels:
        app: botnet-detector
    spec:
      containers:
      - name: botnet-detector
        image: ghcr.io/knight-node64/botnet-attack-detection:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: botnet-detector-config
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
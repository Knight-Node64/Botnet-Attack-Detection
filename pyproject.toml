[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "botnet-attack-detection"
version = "2.0.0"
description = "End-to-end MLOps pipeline for botnet attack detection on UNSW-NB15 network traffic"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "preprocessing", "train_model", "predict"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
